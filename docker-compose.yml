services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartoon_studio
      POSTGRES_USER: cartoon
      POSTGRES_PASSWORD: cartoon
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartoon -d cartoon_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./storage:/workspace/storage
      - ./renders:/workspace/renders
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=1
    env_file: .env
    volumes:
      - ./storage:/workspace/storage
      - ./renders:/workspace/renders
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
