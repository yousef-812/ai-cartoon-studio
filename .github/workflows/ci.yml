name: Quality Checks

on:
  workflow_dispatch:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read

jobs:
  lint-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone PR branch
        run: >-
          git clone --quiet --depth 1 --branch "$GITHUB_HEAD_REF"
          "https://github.com/$GITHUB_REPOSITORY.git" repo
      - name: Install Ruff
        run: python3 -m pip install --quiet "ruff>=0.6,<1.0"
      - name: Run Ruff diagnostics
        working-directory: repo/apps/api
        run: ruff check . ../../packages
