name: Quality Checks

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Run Ruff
        run: |
          set +e
          ruff check . ../../packages --output-format=concise > ruff-report.txt 2>&1
          exit_code=$?
          cat ruff-report.txt
          exit $exit_code
      - name: Upload Ruff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report
          path: apps/api/ruff-report.txt
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
