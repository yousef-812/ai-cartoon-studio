name: Quality Checks

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check . ../../packages
      - name: Run pytest
        id: pytest
        continue-on-error: true
        run: |
          pytest > pytest-report.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Comment pytest report
        if: steps.pytest.outputs.exit_code != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('apps/api/pytest-report.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Artifact route test report\n\n\`\`\`text\n${report.slice(-12000)}\n\`\`\``
            });
      - name: Enforce pytest result
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
