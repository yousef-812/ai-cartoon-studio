name: Quality Checks

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check . ../../packages
      - name: Test core API
        run: pytest tests/test_health.py tests/test_production.py tests/test_series_bible.py
      - name: Test local LLM and stories
        run: pytest tests/test_llm_provider.py tests/test_story_agent.py tests/test_story_jobs.py
      - name: Test scripts and direction
        run: pytest tests/test_script_agent.py tests/test_script_jobs.py tests/test_director_agent.py tests/test_direction_jobs.py
      - name: Test images and visual assets
        run: pytest tests/test_comfyui_provider.py tests/test_visual_asset_planner.py tests/test_local_artifact_store.py
      - name: Test animated shots
        run: pytest tests/test_comfyui_video_provider.py tests/test_animation_planner.py tests/test_video_artifact_store.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
