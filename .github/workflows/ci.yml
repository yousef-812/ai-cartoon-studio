name: Quality Checks

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -e ".[dev]"
      - name: Run Ruff
        id: ruff
        continue-on-error: true
        run: |
          set +e
          ruff check . ../../packages --fix > ruff-output.txt 2>&1
          ruff_exit=$?
          git diff > ruff-report.txt
          printf '\nRuff output:\n' >> ruff-report.txt
          cat ruff-output.txt >> ruff-report.txt
          if ! git diff --quiet; then
            exit 1
          fi
          exit $ruff_exit
      - name: Report Ruff failure
        if: steps.ruff.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('apps/api/ruff-report.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Ruff report\n\n\`\`\`diff\n${report}\n\`\`\``
            });
      - name: Enforce Ruff result
        if: steps.ruff.outcome == 'failure'
        run: exit 1
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
