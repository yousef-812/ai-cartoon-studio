name: First Real Episode Preproduction

on:
  workflow_dispatch:
    inputs:
      llm_base_url:
        description: Public Lightning Qwen URL without a trailing /v1
        required: true
        default: https://8080-01kyczjzm8kp0p64zf4dg29dex.cloudspaces.litng.ai
        type: string
      llm_model:
        description: OpenAI-compatible model ID
        required: true
        default: Qwen/Qwen3-8B-GGUF:Q4_K_M
        type: string

permissions:
  contents: read

concurrency:
  group: first-real-episode-preproduction
  cancel-in-progress: false

jobs:
  preproduction:
    name: Generate story, screenplay, and direction
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ inputs.llm_base_url }}
      LLM_MODEL: ${{ inputs.llm_model }}

    steps:
      - name: Check out the complete production branch
        uses: actions/checkout@v4
        with:
          ref: agent/series-bible-foundation

      - name: Validate protected configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${LLM_API_KEY:-}" ]]; then
            echo "::error::Repository secret LLM_API_KEY is missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [[ ! "$LLM_BASE_URL" =~ ^https:// ]]; then
            echo "::error::llm_base_url must be a public HTTPS URL."
            exit 1
          fi
          echo "::add-mask::$LLM_API_KEY"

      - name: Create the temporary runtime environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storage renders output/first-real-episode
          cat > .env <<EOF
          APP_ENV=development
          API_HOST=0.0.0.0
          API_PORT=8000
          WEB_PORT=3000
          DATABASE_URL=postgresql+psycopg://cartoon:cartoon@postgres:5432/cartoon_studio
          REDIS_URL=redis://redis:6379/0
          STORAGE_PATH=/workspace/storage
          RENDER_PATH=/workspace/renders
          LLM_PROVIDER=local-openai-compatible
          LLM_BASE_URL=$LLM_BASE_URL
          LLM_API_KEY=$LLM_API_KEY
          LLM_MODEL=$LLM_MODEL
          LLM_TIMEOUT_SECONDS=600
          LLM_MAX_RETRIES=2
          LLM_JSON_RESPONSE_FORMAT=true
          IMAGE_PROVIDER=local-comfyui
          IMAGE_BASE_URL=
          IMAGE_WORKFLOW_PATH=/workspace/workflows/comfyui/sdxl.json
          VIDEO_PROVIDER=local-comfyui-video
          VIDEO_BASE_URL=
          VIDEO_WORKFLOW_PATH=/workspace/workflows/comfyui/svd.json
          VOICE_PROVIDER=local-openai-compatible-tts
          VOICE_BASE_URL=
          VOICE_MODEL=piper-arabic
          LIP_SYNC_PROVIDER=local-lip-sync-http
          LIP_SYNC_BASE_URL=
          SOUND_PROVIDER=local-sound-http
          SOUND_BASE_URL=
          FFMPEG_BINARY=ffmpeg
          CELERY_TASK_ALWAYS_EAGER=false
          EOF
          chmod 600 .env

      - name: Verify the remote Qwen endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $LLM_API_KEY" \
            "$LLM_BASE_URL/v1/models" \
            > output/first-real-episode/llm-models.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("output/first-real-episode/llm-models.json").read_text())
          ids = [item.get("id") for item in payload.get("data", [])]
          if not ids:
              raise SystemExit("The remote endpoint returned no OpenAI-compatible models")
          print("Remote models:", ", ".join(str(item) for item in ids))
          PY

      - name: Start PostgreSQL, Redis, API, and Celery
        shell: bash
        run: docker compose up --build --detach postgres redis api worker

      - name: Wait for the production API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health >/dev/null; then
              echo "Production API is ready."
              exit 0
            fi
            sleep 5
          done
          docker compose logs --no-color api worker
          echo "::error::Production API did not become ready."
          exit 1

      - name: Verify Qwen through the production adapter
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            http://127.0.0.1:8000/api/v1/llm/health \
            > output/first-real-episode/llm-health.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("output/first-real-episode/llm-health.json").read_text())
          if payload.get("available") is not True:
              raise SystemExit(f"Production LLM adapter is unavailable: {payload}")
          print(payload)
          PY

      - name: Generate and validate preproduction
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_demo_preproduction.py \
            --api-url http://127.0.0.1:8000 \
            --output-dir output/first-real-episode \
            --timeout-seconds 2700 \
            --poll-seconds 5

      - name: Export the temporary production database
        if: always()
        shell: bash
        run: |
          mkdir -p output/first-real-episode
          docker compose exec -T postgres \
            pg_dump -U cartoon -d cartoon_studio -Fc \
            > output/first-real-episode/cartoon-studio.dump || true

      - name: Collect container diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p output/first-real-episode
          docker compose ps --all > output/first-real-episode/docker-compose-ps.txt || true
          docker compose logs --no-color api worker postgres redis \
            > output/first-real-episode/docker-compose.log 2>&1 || true

      - name: Upload portable preproduction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-real-episode-preproduction-${{ github.run_number }}
          path: output/first-real-episode/
          if-no-files-found: error
          retention-days: 14

      - name: Stop temporary services
        if: always()
        shell: bash
        run: docker compose down --volumes --remove-orphans || true
